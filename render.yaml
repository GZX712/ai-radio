services:
  - type: web
    name: ai-radio-netease
    runtime: node
    plan: free
    rootDir: vendor/NeteaseCloudMusicApi
    buildCommand: npm install
    # 必须用精简入口 app-fixed.js：官方 app.js 没有 /proxy-audio 路由，
    # 前端音频全走它（Range 透传 + 流式转发，2026-09-06 加了续播 seek 支持）
    startCommand: node app-fixed.js
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: ai-radio-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8787
      - key: NODE_ENV
        value: production
      - key: NETEASE_BASE
        sync: false  # 填 ai-radio-netease 的 URL，例如 https://ai-radio-netease.onrender.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NETEASE_COOKIE
        sync: false  # 网易云登录 Cookie（MUSIC_U=xxx;__csrf=yyy），解除版权限制
      - key: TTS_VOICE
        value: en-US-GuyNeural
      - key: PLAYLIST_ID
        value: "18342860645"
      # [2026-09-06] COS 本地音乐库模式：彻底摆脱网易云风控循环
      # - COS_LIBRARY=1 启用 COS 模式，music.ts 走 manifest.json / songs/ 直接播放
      # - COS_BASE_URL 是公开访问前缀（COS 公有读桶返回 url 即可播放，Range 续播可用）
      - key: COS_LIBRARY
        value: "1"
      - key: COS_BASE_URL
        value: "https://ai-radio-library-1463614289.cos.ap-nanjing.myqcloud.com"
    healthCheckPath: /api/health
    autoDeploy: true
