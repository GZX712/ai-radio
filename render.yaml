services:
  - type: web
    name: ai-radio-netease
    runtime: node
    plan: free
    rootDir: vendor/NeteaseCloudMusicApi
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: ai-radio-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8787
      - key: NODE_ENV
        value: production
      - key: NETEASE_BASE
        sync: false  # 填 ai-radio-netease 的 URL，例如 https://ai-radio-netease.onrender.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NETEASE_COOKIE
        sync: false  # 网易云登录 Cookie（MUSIC_U=xxx;__csrf=yyy），解除版权限制
      - key: TTS_VOICE
        value: en-US-GuyNeural
      - key: PLAYLIST_ID
        value: "6920950691"
    healthCheckPath: /api/health
    autoDeploy: true
